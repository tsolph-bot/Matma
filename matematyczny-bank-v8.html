<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Matematyczny Bank</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Baloo 2', -apple-system, system-ui, sans-serif;
    margin: 0; min-height: 100vh;
    background: linear-gradient(180deg,#FFF9E8 0%,#E8F7FF 100%);
    color: #3A3352;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px;
  }
  button { border: none; cursor: pointer; font-family: inherit; transition: transform .12s; }
  button:active { transform: scale(.95); }
  button:focus-visible, input:focus-visible { outline: 3px solid #3A3352; outline-offset: 2px; }
  .card {
    background: #fff; border-radius: 28px; box-shadow: 0 6px 0 #D9D2F0;
    padding: 20px; width: 100%; max-width: 500px; text-align: center;
  }
  .topbar { display: flex; gap: 8px; width: 100%; max-width: 500px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
  .pill { background: #fff; border-radius: 16px; padding: 8px 14px; font-weight: 800; font-size: 17px; box-shadow: 0 4px 0 #D9D2F0; }
  .pill-bank { background: #FFF3C7; box-shadow: 0 4px 0 #E8D48A; }
  .pill-trophy { background: #EDE7FB; box-shadow: 0 4px 0 #C8BBEE; }
  .op { color: #fff; border-radius: 20px; padding: 16px 8px; font-size: 18px; font-weight: 800; box-shadow: 0 5px 0 rgba(0,0,0,.18); opacity:.55; }
  .op span { font-size: 28px; display: block; }
  .op.on { opacity: 1; transform: scale(1.03); }
  .ops { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .big-btn { background:#7E6BF2; color:#fff; border-radius:18px; padding:14px 30px; font-size:20px; font-weight:800; box-shadow:0 5px 0 #5747C9; margin-top:18px; }
  .ghost-btn { background:#EFEBFF; color:#3A3352; border-radius:14px; padding:8px 16px; font-size:15px; font-weight:800; box-shadow:0 4px 0 #D9D2F0; }
  .profile-btn {
    border-radius: 24px; padding: 20px 10px 14px; font-size: 20px; font-weight: 800; width: 100%;
    box-shadow: 0 5px 0 rgba(0,0,0,.15); color: #3A3352; position: relative;
  }
  .profile-btn span.face { font-size: 52px; display: block; margin-bottom: 4px; }
  .mini { position:absolute; top:8px; font-size:14px; background:rgba(255,255,255,.75); border-radius:10px; padding:3px 7px; box-shadow:0 2px 0 rgba(0,0,0,.1); }
  .emoji-pick { font-size: 30px; background: #F4F1FB; border-radius: 14px; padding: 8px 10px; }
  .emoji-pick.on { background: #3A3352; }
  .name-input { font-family: inherit; font-size: 20px; font-weight: 800; text-align: center; border: 3px solid #D9D2F0; border-radius: 14px; padding: 10px; width: 100%; max-width: 280px; color: #3A3352; }
  .lives { font-size: 22px; letter-spacing: 2px; }

  .row { display: flex; align-items: center; gap: 8px; background: #FAF8FF; border-radius: 18px; padding: 10px 12px; margin-bottom: 10px; border: 3px solid transparent; }
  .row .num { font-size: 15px; font-weight: 800; color: #A79FC4; width: 24px; flex-shrink: 0; }
  .row .task { font-size: 25px; font-weight: 800; white-space: nowrap; }
  .row input { width: 76px; font-family: inherit; font-size: 25px; font-weight: 800; text-align: center; border: 3px solid #D9D2F0; border-radius: 12px; padding: 4px 2px; color: #3A3352; background: #fff; }
  .row input:disabled { background: transparent; border-color: transparent; }
  .row .check { background: #FFD24C; border-radius: 12px; font-size: 20px; font-weight: 800; padding: 8px 12px; box-shadow: 0 4px 0 #DFAE24; flex-shrink: 0; }
  .row .stars { margin-left: auto; font-size: 17px; letter-spacing: 1px; flex-shrink: 0; }
  .row.solved { background: #E7F8E4; border-color: #4CB944; }
  .row.solved .task, .row.solved input { color: #35872F; }
  .row.failed { background: #FDEDE6; border-color: #F4845F; }
  .row.failed .task, .row.failed input { color: #C75F3D; }
  .row.shake { animation: shake .4s; }

  .summary { margin-top: 16px; background: #F4F9FF; border-radius: 22px; padding: 16px; }
  .summary table { width: 100%; font-size: 16px; font-weight: 700; border-collapse: collapse; }
  .summary td { padding: 4px 2px; text-align: left; }
  .summary td:last-child { text-align: right; font-weight: 800; }
  .reset-note { background: #FDEDE6; border: 3px solid #F4845F; border-radius: 18px; padding: 10px 14px; margin-bottom: 12px; font-weight: 800; color: #C75F3D; }
  .warn-note { background: #FFF6DA; border: 3px solid #FFD24C; border-radius: 18px; padding: 10px 14px; margin-bottom: 12px; font-weight: 800; color: #8A6D1A; }
  .medal-earned { margin-top:16px; background:#FFF6DA; border:3px dashed #FFD24C; border-radius:22px; padding:16px; }
  .muted { color: #7A7395; font-weight: 700; }
  .hist { text-align: left; font-size: 14px; font-weight: 700; color: #7A7395; max-height: 200px; overflow-y: auto; }
  .hist div { padding: 6px 4px; border-bottom: 1px solid #EFEBFF; display: flex; justify-content: space-between; gap: 8px; }
  .footer { margin-top: 14px; font-size: 13px; color: #A79FC4; font-weight: 700; }

  /* Gablota trofeów */
  /* Gablota — piramida osiągnięć */
  .pyramid { display: flex; flex-direction: column-reverse; gap: 0; }
  .tier { border-radius: 20px; padding: 14px 12px 16px; margin: 5px auto; width: 100%; position: relative; text-align: center; box-shadow: 0 5px 0 rgba(0,0,0,.08); }
  .tier-medals { width: 100%;  background: linear-gradient(180deg,#FBF7F0,#F0E7DA); }
  .tier-cups   { width: 88%;   background: linear-gradient(180deg,#FDF6E3,#F6E7BE); }
  .tier-crowns { width: 72%;   background: linear-gradient(180deg,#F3ECFB,#E4D4F5); }
  .tier-diamond{ width: 56%;   background: linear-gradient(135deg,#E6F7FF,#F3E8FF); border:3px solid #B9E1F2; }
  .tier .tier-title { font-size: 15px; font-weight: 800; margin: 0 0 8px; color: #6B6386; }
  .arrow-up { text-align:center; font-size: 18px; color:#B4AECB; margin: -2px 0; line-height:1; }
  .arrow-up small { font-size: 11px; font-weight:800; color:#A79FC4; }
  .tset { display:flex; justify-content:center; align-items:center; gap:14px; flex-wrap:wrap; }
  .tcol { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .ticons { letter-spacing:1px; line-height:1.1; }
  .tprog { font-size:12px; font-weight:800; color:#8A7FA8; }
  .slot { display:inline-block; }
  .slot.empty { filter: grayscale(1) brightness(1.7); opacity:.35; }
  .bridge { display:flex; justify-content:space-around; font-size:11px; font-weight:800; color:#9A6B2E; margin:3px 6px 0; }

  @keyframes pop { 0%{transform:scale(.4);opacity:0} 70%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  @keyframes wobble { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
  @keyframes shine { 0%,100%{transform:scale(1) rotate(0)} 50%{transform:scale(1.25) rotate(8deg)} }
  .pop { animation: pop .45s ease-out; }
  .wobble { animation: wobble 1.2s ease-in-out infinite; display: inline-block; }
  .shine { animation: shine 1s ease-in-out infinite; display:inline-block; }
  @media (prefers-reduced-motion: reduce) { .pop,.wobble,.row.shake,.shine{animation:none} button{transition:none} }
</style>
</head>
<body>
  <div class="topbar" id="topbar"></div>
  <div class="card" id="app"></div>
  <p class="footer" id="footer"></p>

<script>
// ================== USTAWIENIA DOMYŚLNE ==================
// To są wartości startowe. Rodzic może je zmienić w apce (⚙️ Ustawienia).
const ZYCIA = 3;              // niewykonane zadania zanim karta się resetuje

const DEFAULT_SETTINGS = {
  // Stawka za kartę zależy od poziomu trudności (żeby łatwe poziomy nie nabijały kasy).
  // Progi: dla poziomu >= .level obowiązuje .zl (bierzemy najwyższy pasujący próg).
  rateTiers: [
    { level: 1, zl: 0.5 },  // poziomy 1-2: 50 gr
    { level: 3, zl: 1 },    // poziomy 3-5: 1 zł
    { level: 6, zl: 2 },    // poziomy 6+: 2 zł
  ],
  zlGwiazdka: 1,     // za zadanie z gwiazdką (tylko starszy szablon)
  karaReset: 1,      // kara za reset karty (utrata wszystkich żyć)
  nagrodaPuchar: 5,  // premia za zdobycie pucharu
  nagrodaKorona: 10, // premia za zdobycie korony
  nagrodaGwiazda: 20,// premia za diamentową gwiazdę
};
const PARENT_PIN = "1234"; // PIN do panelu rodzica (zmień, jeśli chcesz)

// Reguła Trójki
const DO_PUCHARU = 3;   // medali jednego koloru -> puchar
const DO_KORONY  = 3;   // pucharów jednego koloru -> korona
const DO_GWIAZDY = 3;   // złotych koron -> diamentowa gwiazda

const TEMPLATES = {
  young: {
    label: "Młodsze dziecko (5 zadań, + i −)",
    tasks: 5, starTask: false,
    ops: ["add","sub"],
    maxLevel: 6, startLevel: 1,
  },
  old: {
    label: "Starsze dziecko (10 zadań, wszystkie działania)",
    tasks: 10, starTask: true,
    ops: ["add","sub","mul","mix"],
    maxLevel: 10, startLevel: 1,
  },
};
// =================================================================

const MAX_TRIES = 3;
const EMOJIS = ["👧","👦","🧒","👶","🦄","🐻","🐱","🦖"];
const COLORS = [
  { bg: "#FDE8EF", shadow: "#F2B8CE" }, { bg: "#DCEFFB", shadow: "#A9CFE8" },
  { bg: "#E4F6E1", shadow: "#B4DFAE" }, { bg: "#FFF1D6", shadow: "#EFD39A" },
  { bg: "#EDE7FB", shadow: "#C8BBEE" },
];
const ALL_OPS = [
  { id: "add", symbol: "+",  label: "Dodawanie",   color: "#4CB944" },
  { id: "sub", symbol: "−",  label: "Odejmowanie", color: "#F4845F" },
  { id: "mul", symbol: "×",  label: "Mnożenie",    color: "#7E6BF2" },
  { id: "mix", symbol: "🎲", label: "Mieszanka",   color: "#2FA8D5" },
];
const MEDAL = { gold: "🥇", silver: "🥈", bronze: "🥉" };
const CUP   = { gold: "🏆", silver: "🥈🏆", bronze: "🥉🏆" };
const CUP_ICON = { gold: "🏆", silver: "🏆", bronze: "🏆" };
const CROWN = { gold: "👑", silver: "👑", bronze: "👑" };

// ---------- Definicja trudności poziomów ----------
// Zwraca zakres/typ zadania dla danego działania i poziomu (1..10)
function levelSpec(op, lvl) {
  // op: add|sub|mul ; lvl rośnie -> trudniej
  if (op === "add") {
    switch(lvl) {
      case 1: return { max: 5,   minTerm: 1, cross: false };
      case 2: return { max: 10,  minTerm: 1, cross: false };
      case 3: return { max: 20,  minTerm: 3, cross: false };  // 12+5
      case 4: return { max: 20,  minTerm: 3, cross: true };   // 8+7
      case 5: return { max: 50,  minTerm: 5, cross: false };  // 23+14
      case 6: return { max: 50,  minTerm: 6, cross: true };   // 27+15
      case 7: return { max: 100, minTerm: 10, cross: false };
      case 8: return { max: 100, minTerm: 12, cross: true };  // 48+37
      case 9: return { max: 100, minTerm: 15, cross: true, three: true };
      default:return { max: 150, minTerm: 15, cross: true, three: true };
    }
  }
  if (op === "sub") {
    switch(lvl) {
      case 1: return { max: 5,   borrow: false };
      case 2: return { max: 10,  borrow: false };
      case 3: return { max: 20,  borrow: false };
      case 4: return { max: 20,  borrow: true };
      case 5: return { max: 50,  borrow: false };
      case 6: return { max: 50,  borrow: true };
      case 7: return { max: 100, borrow: false };
      case 8: return { max: 100, borrow: true };
      case 9: return { max: 100, borrow: true, minA: 40 };
      default:return { max: 150, borrow: true, minA: 60 };
    }
  }
  // mul
  switch(lvl) {
    case 1: return { tables: [2,5,10], upTo: 5 };
    case 2: return { tables: [2,5,10], upTo: 10 };
    case 3: return { tables: [3,4], upTo: 10 };
    case 4: return { tables: [2,3,4,5], upTo: 10 };
    case 5: return { tables: [6,7], upTo: 10 };
    case 6: return { tables: [8,9], upTo: 10 };
    case 7: return { tables: [3,4,6,7,8,9], upTo: 10 };
    case 8: return { tables: [2,3,4,5,6,7,8,9], upTo: 12 };
    case 9: return { tables: [6,7,8,9,11,12], upTo: 12 };
    default:return { tables: [7,8,9,11,12], upTo: 12 };
  }
}

// ---------- Stan + zapis ----------
function newProfile(name, emoji, template) {
  const t = TEMPLATES[template];
  const settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  if (!t.starTask) settings.zlGwiazdka = 0;
  return {
    id: "p" + Date.now() + rand(1000), name, emoji, template,
    bank: 0, history: [], op: "add",
    settings,
    // ukryty adaptacyjny poziom per działanie
    powers: { add: t.startLevel, sub: t.startLevel, mul: t.startLevel },
    maxPowers: { add: t.startLevel, sub: t.startLevel, mul: t.startLevel },
    // trofea: liczniki medali/pucharów/koron per kolor + gwiazda
    trophies: {
      medals: { gold: 0, silver: 0, bronze: 0 },
      cups:   { gold: 0, silver: 0, bronze: 0 },
      crowns: { gold: 0, silver: 0, bronze: 0 },
      diamond: 0,
    },
  };
}
let data = { profiles: [] };
function loadFrom(key) {
  try { const s = JSON.parse(localStorage.getItem(key) || "null"); if (s && Array.isArray(s.profiles) && s.profiles.length) return s.profiles; } catch(e) {}
  return null;
}
data.profiles = loadFrom("mathbank-v8") || [];
if (!data.profiles.length) {
  // v4 ma już pełną strukturę (trofea, poziomy) — bierzemy w całości
  const v4 = loadFrom("mathbank-v7") || loadFrom("mathbank-v6") || loadFrom("mathbank-v5") || loadFrom("mathbank-v4");
  if (v4) data.profiles = v4;
  else {
    // starsze wersje: tylko bank i historia
    const old = loadFrom("mathbank-v3") || loadFrom("mathbank-v2");
    if (old) data.profiles = old.map(p => {
      const np = newProfile(p.name, p.emoji, p.template || "old");
      np.bank = p.bank || 0; np.history = p.history || [];
      return np;
    });
  }
}
if (!data.profiles.length) data.profiles = [ newProfile("Córka", "👧", "young"), newProfile("Syn", "👦", "old") ];
// uzupełnij brakujące pola (gdyby profil był ze starszej struktury)
data.profiles.forEach(p => {
  const t = TEMPLATES[p.template] || TEMPLATES.old;
  if (!p.powers) p.powers = { add: t.startLevel, sub: t.startLevel, mul: t.startLevel };
  if (!p.maxPowers) p.maxPowers = { ...p.powers };
  if (!p.trophies) p.trophies = { medals:{gold:0,silver:0,bronze:0}, cups:{gold:0,silver:0,bronze:0}, crowns:{gold:0,silver:0,bronze:0}, diamond:0 };
  if (!p.settings) { p.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS)); if (!t.starTask) p.settings.zlGwiazdka = 0; }
  else {
    for (const k in DEFAULT_SETTINGS) if (p.settings[k] === undefined) p.settings[k] = JSON.parse(JSON.stringify(DEFAULT_SETTINGS[k]));
    // migracja: stara płaska stawka -> progi
    if (!p.settings.rateTiers) {
      const flat = (typeof p.settings.zlKarta === "number") ? p.settings.zlKarta : 1;
      p.settings.rateTiers = [{ level:1, zl: Math.min(flat,0.5) }, { level:3, zl: flat }, { level:6, zl: flat*2 }];
    }
    delete p.settings.zlKarta;
  }
});

function save() {
  try { localStorage.setItem("mathbank-v8", JSON.stringify({ profiles: data.profiles.map(p => ({ ...p, history: p.history.slice(-100) })) })); } catch(e) {}
}

let ui = {
  screen: "profiles", currentId: null,
  tasks: [], bonus: null, bonusUnlocked: false,
  fails: 0, wrongTotal: 0, cardResets: 0, justReset: false,
  settled: false, lastEarn: null, lastMedal: null, newTrophies: [],
  activeOp: "add",
  newName: "", newEmoji: EMOJIS[2], newTemplate: "young",
};

function rand(n) { return Math.floor(Math.random() * n); }
const zl = v => (v % 1 === 0 ? v : v.toFixed(2)) + " zł";
const P = () => data.profiles.find(p => p.id === ui.currentId);
const S = () => P().settings;
const CFG = () => TEMPLATES[P().template];

// stawka za kartę wg poziomu trudności (najwyższy pasujący próg)
function rateForLevel(lvl) {
  const tiers = (S().rateTiers || []).slice().sort((a,b)=>a.level-b.level);
  let zl = tiers.length ? tiers[0].zl : 1;
  for (const t of tiers) if (lvl >= t.level) zl = t.zl;
  return zl;
}

// ---------- Grafiki nominałów (autorskie, wgrane przez rodzica) ----------

const MONEY_ASPECT = {"50gr": 0.9588, "1zl": 0.9327, "2zl": 0.9373, "5zl": 0.9408, "10": 1.6, "20": 1.6749, "50": 1.7331, "100": 1.7532, "200": 1.8263};
// nominały od największego do najmniejszego (w groszach dla precyzji)
const DENOMS = [
  { key:"200", gr:20000 }, { key:"100", gr:10000 }, { key:"50", gr:5000 },
  { key:"20", gr:2000 }, { key:"10", gr:1000 }, { key:"5zl", gr:500 },
  { key:"2zl", gr:200 }, { key:"1zl", gr:100 }, { key:"50gr", gr:50 },
];
const DENOM_LABEL = { "50gr":"50 gr","1zl":"1 zł","2zl":"2 zł","5zl":"5 zł","10":"10 zł","20":"20 zł","50":"50 zł","100":"100 zł","200":"200 zł" };
function isCoinDenom(k){ return ["50gr","1zl","2zl","5zl"].indexOf(k)>=0; }
// pojedyncza grafika nominału o zadanej wysokości (px)
function moneyImg(key, h) {
  h = h || (isCoinDenom(key)?46:34);
  const w = Math.round(h * (MONEY_ASPECT[key]||1));
  return `<img src="${MONEY_IMG[key]}" width="${w}" height="${h}" alt="${DENOM_LABEL[key]}" style="vertical-align:middle;object-fit:contain">`;
}
// najlepszy pojedynczy nominał <= kwota (do podsumowania karty)
function moneyGraphic(amount, size) {
  const gr = Math.round(amount*100);
  for (const d of DENOMS) if (gr >= d.gr) return moneyImg(d.key, size || (isCoinDenom(d.key)?54:40));
  return moneyImg("50gr", size||54);
}
// rozkład kwoty na monety/banknoty (największe najpierw) -> tablica {key,count}
function moneyBreakdown(amount) {
  let gr = Math.round(amount*100);
  const out = [];
  for (const d of DENOMS) { if (gr >= d.gr) { const c = Math.floor(gr/d.gr); gr -= c*d.gr; out.push({key:d.key, count:c}); } }
  return out;
}
// render rozkładu jako grafiki (dla panelu banku)
function moneyBreakdownHTML(amount, h) {
  const bd = moneyBreakdown(amount);
  if (!bd.length) return `<div class="muted">Pusto — czas zarobić pierwsze monety!</div>`;
  return `<div style="display:flex;flex-wrap:wrap;gap:10px 14px;justify-content:center;align-items:center">` +
    bd.map(b => `<div style="display:flex;align-items:center;gap:4px">${moneyImg(b.key, h||(isCoinDenom(b.key)?50:36))}${b.count>1?`<span style="font-weight:800;font-size:16px">×${b.count}</span>`:""}</div>`).join("") +
    `</div>`;
}
const colorOf = p => COLORS[data.profiles.indexOf(p) % COLORS.length];
const stamp = () => new Date().toISOString().slice(0,16).replace("T"," ");
const livesHtml = () => "❤️".repeat(ZYCIA - ui.fails) + "🤍".repeat(ui.fails);
// dla mieszanki bierzemy poziom jako średnią z 3 działań
function powerFor(op) { const p = P(); return op === "mix" ? Math.round((p.powers.add + p.powers.sub + p.powers.mul)/3) : p.powers[op]; }

// ---------- Generowanie zadań wg poziomu ----------
function genAdd(lvl) {
  const s = levelSpec("add", lvl);
  for (let g=0; g<200; g++) {
    let a, b;
    if (s.max <= 10) { a = 1 + rand(s.max-1); b = 1 + rand(s.max - a); }
    else { a = s.minTerm + rand(s.max - s.minTerm); b = s.minTerm + rand(Math.max(1, s.max - a)); }
    if (a < s.minTerm || b < 1) continue;
    const sum = a + b;
    if (sum > s.max || sum < 2) continue;
    const crosses = (a % 10) + (b % 10) >= 10;
    if (s.cross && !crosses) continue;
    if (!s.cross && s.max > 20 && crosses) continue;
    if (s.three) { const c = 1 + rand(Math.max(1, s.max - sum)); if (sum + c <= s.max) return { a: a, b: b, c: c, symbol:"+", answer: sum + c, three:true }; else continue; }
    return { a, b, symbol:"+", answer: sum };
  }
  const a = 1+rand(9), b=1+rand(9); return { a, b, symbol:"+", answer:a+b };
}
function genSub(lvl) {
  const s = levelSpec("sub", lvl);
  for (let g=0; g<200; g++) {
    let a = (s.minA||2) + rand(s.max - (s.minA||1));
    let b = 1 + rand(a-1);
    const borrows = (a % 10) < (b % 10);
    if (s.borrow && !borrows) continue;
    if (!s.borrow && s.max > 20 && borrows) continue;
    return { a, b, symbol:"−", answer: a-b };
  }
  const a=5+rand(10), b=1+rand(4); return { a, b, symbol:"−", answer:a-b };
}
function genMul(lvl) {
  const s = levelSpec("mul", lvl);
  const t = s.tables[rand(s.tables.length)];
  const o = 1 + rand(s.upTo);
  return (rand(2) ? { a:t, b:o, symbol:"×", answer:t*o } : { a:o, b:t, symbol:"×", answer:t*o });
}
function makeTask(opId, harder) {
  let op = opId === "mix" ? ["add","sub","mul"][rand(3)] : opId;
  let lvl = powerFor(op);
  if (harder) lvl = Math.min((TEMPLATES[P().template].maxLevel), lvl + 1);
  let t;
  if (op === "add") t = genAdd(lvl);
  else if (op === "sub") t = genSub(lvl);
  else t = genMul(lvl);
  t.tries = MAX_TRIES; t.status = "open";
  return t;
}

function taskText(t) { return t.three ? `${t.a} + ${t.b} + ${t.c} =` : `${t.a} ${t.symbol} ${t.b} =`; }
function taskKey(t) { return t.three ? `${t.a}+${t.b}+${t.c}` : `${t.a}${t.symbol}${t.b}`; }

function buildSheet(isReset) {
  ui.activeOp = P().op;
  ui.tasks = [];
  const seen = new Set();
  let guard = 0;
  while (ui.tasks.length < CFG().tasks && guard++ < 300) {
    const t = makeTask(P().op, false);
    const key = taskKey(t);
    if (!seen.has(key)) { seen.add(key); ui.tasks.push(t); }
  }
  ui.bonus = CFG().starTask ? makeTask(P().op, true) : null;
  ui.bonusUnlocked = false;
  ui.fails = 0; ui.wrongTotal = 0;
  ui.settled = false; ui.lastEarn = null; ui.lastMedal = null; ui.newTrophies = [];
  ui.justReset = !!isReset;
  if (!isReset) ui.cardResets = 0;
}
function startSheet() { buildSheet(false); ui.screen = "sheet"; render(); }

// ---------- Sprawdzanie ----------
function checkTask(i) {
  const t = i === "bonus" ? ui.bonus : ui.tasks[i];
  if (!t || t.status !== "open") return;
  const inp = document.getElementById("inp-" + i);
  const val = parseInt((inp.value || "").trim(), 10);
  if (isNaN(val)) { inp.focus(); return; }

  if (val === t.answer) { t.status = "solved"; ui.justReset = false; settleIfDone(); render(); return; }

  t.tries--;
  if (i !== "bonus") ui.wrongTotal++;

  if (t.tries <= 0) {
    t.status = "failed";
    if (i !== "bonus") {
      ui.fails++;
      if (ui.fails >= ZYCIA) {
        // reset karty + kara finansowa
        const p = P();
        p.bank = Math.max(0, p.bank - S().karaReset);
        p.history.push({ d: stamp(), op: "💔", lvl: "Reset karty", err: "", earn: -S().karaReset });
        adaptDown();
        save();
        ui.cardResets++;
        buildSheet(true);
        render();
        return;
      }
    }
    settleIfDone(); render(); return;
  }
  const row = document.getElementById("row-" + i);
  row.classList.add("shake");
  const st = document.getElementById("stars-" + i);
  if (st) st.innerHTML = starsHtml(t);
  inp.value = "";
  setTimeout(() => { row.classList.remove("shake"); inp.focus(); }, 420);
}

const allDone = () => ui.tasks.every(t => t.status !== "open");
const allSolved = () => ui.tasks.every(t => t.status === "solved");
const qualifiesForBonus = () => CFG().starTask && ui.tasks.every(t => t.status === "solved" && t.tries >= 2);
const perfect = () => ui.wrongTotal === 0 && ui.cardResets === 0 && allSolved();

// adaptacja trudności
function adaptUp() {
  const p = P(), op = ui.activeOp;
  const mx = TEMPLATES[p.template].maxLevel;
  const targets = op === "mix" ? ["add","sub","mul"] : [op];
  targets.forEach(o => { if (p.powers[o] < mx) p.powers[o]++; if (p.powers[o] > p.maxPowers[o]) p.maxPowers[o] = p.powers[o]; });
}
function adaptDown() {
  const p = P(), op = ui.activeOp;
  const targets = op === "mix" ? ["add","sub","mul"] : [op];
  targets.forEach(o => { const floor = Math.max(1, p.maxPowers[o] - 2); if (p.powers[o] > floor) p.powers[o]--; });
}

// przyznanie medalu + kaskada trofeów (Reguła Trójki) + wymiana w górę (Wariant B)
function awardMedal(color) {
  const p = P(), tr = p.trophies;
  tr.medals[color]++;
  ui.newTrophies = [];
  ui.lastMedal = color;
  resolveTrophies();
}

// Rozwiązuje wszystkie kaskady i wymiany aż do stabilizacji.
// Kolejność w każdej rundzie:
//   1) medale (3) -> puchar
//   2) puchary (3) -> korona  (dla każdego koloru)
//   3) 3 złote korony -> Diament
//   4) wymiana w górę leftover pucharów: 3 brąz -> 1 srebrny medal, 3 srebro -> 1 złoty medal
function resolveTrophies() {
  const p = P(), tr = p.trophies;
  let changed = true;
  let guard = 0;
  while (changed && guard++ < 300) {
    changed = false;

    // 1) medale -> puchary
    for (const color of ["bronze","silver","gold"]) {
      if (tr.medals[color] >= DO_PUCHARU) {
        tr.medals[color] -= DO_PUCHARU;
        tr.cups[color]++;
        grantCash(S().nagrodaPuchar, "🏆 " + colorPL(color) + " puchar");
        ui.newTrophies.push({ t:"cup", color });
        changed = true;
      }
    }

    // 2) puchary -> korony
    for (const color of ["bronze","silver","gold"]) {
      if (tr.cups[color] >= DO_KORONY) {
        tr.cups[color] -= DO_KORONY;
        tr.crowns[color]++;
        grantCash(S().nagrodaKorona, "👑 " + colorPL(color) + " korona");
        ui.newTrophies.push({ t:"crown", color });
        changed = true;
      }
    }

    // 3) 3 złote korony -> Diament
    if (tr.crowns.gold >= DO_GWIAZDY) {
      tr.crowns.gold -= DO_GWIAZDY;
      tr.diamond++;
      grantCash(S().nagrodaGwiazda, "💎 Diament");
      ui.newTrophies.push({ t:"diamond", color:"diamond" });
      changed = true;
    }

    if (changed) continue; // najpierw wyczerp normalne kaskady

    // 4) WYMIANA W GÓRĘ (gdy nic więcej się nie składa):
    //    zbierz pojedyncze korony brąz/srebro nie prowadzą wyżej,
    //    więc pomostem są NADMIAROWE korony niższych kolorów.
    // 3 brązowe korony -> 1 srebrna korona
    if (tr.crowns.bronze >= 3) {
      tr.crowns.bronze -= 3;
      tr.crowns.silver++;
      ui.newTrophies.push({ t:"upgrade", from:"bronze", to:"silver" });
      changed = true; continue;
    }
    // 3 srebrne korony -> 1 złota korona
    if (tr.crowns.silver >= 3) {
      tr.crowns.silver -= 3;
      tr.crowns.gold++;
      ui.newTrophies.push({ t:"upgrade", from:"silver", to:"gold" });
      changed = true; continue;
    }
  }
}
function grantCash(amount, label) {
  const p = P();
  p.bank += amount;
  p.history.push({ d: stamp(), op: "🎁", lvl: label, err: "", earn: amount });
  ui._trophyEarn = (ui._trophyEarn || 0) + amount;
}
const colorPL = c => c === "gold" ? "złoty" : c === "silver" ? "srebrny" : "brązowy";

function settleIfDone() {
  if (!allDone()) return;
  if (!ui.bonusUnlocked && qualifiesForBonus()) { ui.bonusUnlocked = true; return; }
  if (ui.bonusUnlocked && ui.bonus.status === "open") return;
  if (ui.settled) return;

  const cfg = CFG(), p = P();
  const lines = [];
  let earn = 0;
  ui._trophyEarn = 0;
  const solvedCount = ui.tasks.filter(t => t.status === "solved").length;

  const cardLevel = powerFor(ui.activeOp);
  const cardRate = rateForLevel(cardLevel);
  earn += cardRate;
  lines.push(["Ukończona karta (poz. " + cardLevel + ")", "+" + zl(cardRate)]);
  if (ui.bonusUnlocked && ui.bonus && ui.bonus.status === "solved") {
    earn += S().zlGwiazdka;
    lines.push(["🌟 Zadanie z gwiazdką", "+" + zl(S().zlGwiazdka)]);
  }
  p.bank = Math.max(0, p.bank + earn);

  // ustal kolor medalu
  let color;
  if (perfect()) color = "gold";
  else if (ui.fails === 0) color = "silver";
  else color = "bronze";

  // adaptacja: bez straty życia -> w górę, inaczej -> lekko w dół
  if (ui.fails === 0 && ui.cardResets === 0) adaptUp();
  else adaptDown();

  // przyznaj medal (może wywołać kaskadę i nagrody finansowe)
  awardMedal(color);

  lines.push([MEDAL[color] + " Medal " + colorPL(color), ""]);
  if (ui._trophyEarn > 0) lines.push(["🎁 Nagrody za trofea", "+" + zl(ui._trophyEarn)]);

  ui.lastEarn = { earn: earn + (ui._trophyEarn||0), cardRate, color, lines };
  ui.settled = true;
  p.history.push({
    d: stamp(),
    op: ALL_OPS.find(o => o.id === p.op).symbol,
    lvl: "poz. " + powerFor(ui.activeOp) + " " + MEDAL[color],
    err: ui.wrongTotal + (ui.cardResets ? " (resety:"+ui.cardResets+")" : ""),
    earn,
  });
  save();
}

function starsHtml(t) { let h=""; for (let s=0;s<MAX_TRIES;s++) h += s<t.tries ? "⭐" : "<span style='opacity:.25'>⭐</span>"; return h; }

// ---------- Bank / eksport ----------
function payout() {
  const p = P(); if (p.bank <= 0) return;
  if (!confirm("Wypłacić " + zl(p.bank) + " (" + p.name + ") i wyzerować bank?")) return;
  p.history.push({ d: stamp(), op: "💸", lvl: "Wypłata", err: "", earn: -p.bank });
  p.bank = 0; save(); render();
}
function exportData() {
  const blob = new Blob([JSON.stringify({ profiles: data.profiles }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "matematyczny-bank-kopia.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function importData() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const parsed = JSON.parse(r.result);
        if (!parsed.profiles || !Array.isArray(parsed.profiles)) throw 0;
        if (!confirm("Wczytać kopię? Zastąpi obecne dane na tym urządzeniu.")) return;
        data.profiles = parsed.profiles;
        data.profiles.forEach(p => {
          const t = TEMPLATES[p.template] || TEMPLATES.old;
          if (!p.powers) p.powers = { add:t.startLevel, sub:t.startLevel, mul:t.startLevel };
          if (!p.maxPowers) p.maxPowers = { ...p.powers };
          if (!p.trophies) p.trophies = { medals:{gold:0,silver:0,bronze:0}, cups:{gold:0,silver:0,bronze:0}, crowns:{gold:0,silver:0,bronze:0}, diamond:0 };
        });
        save(); ui.currentId = null; ui.screen = "profiles"; render();
        alert("Gotowe! Kopia wczytana ✅");
      } catch(err) { alert("Nie udało się wczytać pliku 😕"); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function resetProfileData() {
  if (!confirm("Skasować historię i wyzerować bank profilu " + P().name + "? (trofea zostają)")) return;
  P().bank = 0; P().history = []; save(); render();
}

function goSettings() {
  const ans = prompt("Panel rodzica 🔒\nPodaj PIN (domyślnie " + PARENT_PIN + "):");
  if (ans === null) return;
  if (ans.trim() !== PARENT_PIN) { alert("Niepoprawny PIN 🙃"); return; }
  ui.screen = "settings"; render();
}
function saveSettings() {
  const s = S();
  const fields = ["zlGwiazdka","karaReset","nagrodaPuchar","nagrodaKorona","nagrodaGwiazda"];
  for (const f of fields) {
    const el = document.getElementById("set-" + f);
    if (!el) continue;
    let v = parseFloat((el.value || "").replace(",", "."));
    if (isNaN(v) || v < 0) v = 0;
    v = Math.round(v * 100) / 100;
    s[f] = v;
  }
  // stawki progowe za kartę (3 progi)
  const tiers = [];
  for (let i=0;i<3;i++) {
    const lvlEl = document.getElementById("tier-lvl-"+i);
    const zlEl = document.getElementById("tier-zl-"+i);
    if (!lvlEl || !zlEl) continue;
    let lvl = parseInt(lvlEl.value, 10); if (isNaN(lvl) || lvl < 1) lvl = 1;
    let z = parseFloat((zlEl.value||"").replace(",",".")); if (isNaN(z) || z < 0) z = 0;
    z = Math.round(z*100)/100;
    tiers.push({ level: lvl, zl: z });
  }
  tiers.sort((a,b)=>a.level-b.level);
  if (tiers.length) s.rateTiers = tiers;
  save();
  alert("Zapisano ustawienia ✅");
  ui.screen = "menu"; render();
}

    <h2 style="font-size:21px;font-weight:800;margin:0 0 2px">${ALL_OPS.find(o=>o.id===p.op).label} · poziom ${powerFor(ui.activeOp)}</h2>
    <p class="muted" style="margin:0 0 10px;font-size:14px">Rozwiązane: ${solved}/${cfg.tasks} · Życia: <span class="lives">${livesHtml()}</span></p>`;
  if (ui.justReset) h += `<div class="reset-note pop">🔄 Straciłeś wszystkie ❤️! Karta od nowa, −${zl(S().karaReset)} z banku. Dasz radę następnym razem! 💪</div>`;
  else if (!ui.settled && ui.fails === ZYCIA-1) h += `<div class="warn-note">⚠️ Ostatnie ❤️! Jeszcze jedno niewykonane zadanie i karta się zresetuje (−${zl(S().karaReset)}).</div>`;

  h += `<div style="text-align:left">${ui.tasks.map((t,i)=>rowHtml(t,i,false)).join("")}</div>`;

  if (cfg.starTask) {
    if (!done) h += `<div class="medal-earned muted" style="font-size:15px;border-style:dashed">🌟 Zadanie z gwiazdką (+${zl(S().zlGwiazdka)}) pojawi się, gdy rozwiążesz wszystkie zadania z min. 2 ⭐</div>`;
    else if (ui.bonusUnlocked) h += `<div class="medal-earned"><p style="margin:0 0 8px;font-weight:800;font-size:19px" class="pop">🌟 ZADANIE Z GWIAZDKĄ! (+${zl(S().zlGwiazdka)})</p><div style="text-align:left">${rowHtml(ui.bonus,0,true)}</div></div>`;
  }

  if (ui.settled && ui.lastEarn) {
    const e = ui.lastEarn;
    let tro = "";
    if (ui.newTrophies.length) {
      tro = `<div style="margin:8px 0"><span class="shine" style="font-size:40px">${ui.newTrophies.map(x=>x.t==="diamond"?"💎":x.t==="crown"?"👑":x.t==="upgrade"?"🔁👑":"🏆").join(" ")}</span>
        <div style="font-weight:800;color:#8A6D1A">Nowe trofeum zdobyte!</div></div>`;
    }
    h += `<div class="summary pop">
      <p style="font-size:26px;margin:0 0 4px">${MEDAL[e.color]}</p>
      <p style="font-size:22px;font-weight:800;margin:0 0 8px">${e.color==="gold"?"🏆 Perfekcyjnie!":e.color==="silver"?"🎉 Świetnie!":"👍 Ukończone!"}</p>
      <div style="margin:6px 0">${moneyGraphic(e.cardRate)}<div class="muted" style="font-size:13px">zarobek za tę kartę</div></div>
      ${tro}
      <table>${e.lines.map(l=>`<tr><td>${l[0]}</td><td>${l[1]}</td></tr>`).join("")}
        <tr><td style="border-top:2px solid #D9D2F0;padding-top:6px"><b>Razem</b></td>
        <td style="border-top:2px solid #D9D2F0;padding-top:6px">+${zl(e.earn)}</td></tr>
      </table>
      <p class="muted" style="margin:8px 0 0">W banku: <b>${zl(p.bank)}</b> 🏦</p>
      <button class="big-btn" onclick="startSheet()">Nowa karta 📄</button>
    </div>`;
  }
  return h;
}

// zestaw ikon: wypełnione + puste sloty do progu
function icons(count, need, filled, size) {
  let h = "";
  for (let i=0;i<need;i++) h += `<span class="slot ${i<count?"":"empty"}" style="font-size:${size}px">${filled}</span>`;
  return h;
}
// dla liczników bez progu (korony/diament) — pokaż zdobyte + ewentualny cel
function ownedIcons(count, filled, size, minShow) {
  const n = Math.max(count, minShow||0);
  let h = "";
  for (let i=0;i<n;i++) h += `<span class="slot ${i<count?"":"empty"}" style="font-size:${size}px">${filled}</span>`;
  return h || `<span class="slot empty" style="font-size:${size}px">${filled}</span>`;
}

function renderTrophies() {
  const p = P(), tr = p.trophies;
  const COL = { gold:"złoto", silver:"srebro", bronze:"brąz" };

  // TIER: medale (baza)
  const medalsTier = `
    <div class="tier tier-medals">
      <p class="tier-title">🥉🥈🥇 Medale — za każdą kartę</p>
      <div class="tset">
        ${["bronze","silver","gold"].map(c => `
          <div class="tcol">
            <div class="ticons">${icons(tr.medals[c], DO_PUCHARU, MEDAL[c], 26)}</div>
            <div class="tprog">${tr.medals[c]}/${DO_PUCHARU} → 🏆</div>
          </div>`).join("")}
      </div>
    </div>`;

  // TIER: puchary
  const cupsTier = `
    <div class="tier tier-cups">
      <p class="tier-title">🏆 Puchary — 3 medale = puchar</p>
      <div class="tset">
        ${["bronze","silver","gold"].map(c => `
          <div class="tcol">
            <div class="ticons">${icons(tr.cups[c], DO_KORONY, "🏆", 30)}</div>
            <div class="tprog">${tr.cups[c]}/${DO_KORONY} → 👑</div>
          </div>`).join("")}
      </div>
    </div>`;

  // TIER: korony (z mostkami wymiany)
  const crownsTier = `
    <div class="tier tier-crowns">
      <p class="tier-title">👑 Korony — 3 puchary = korona</p>
      <div class="tset">
        ${["bronze","silver","gold"].map(c => `
          <div class="tcol">
            <div class="ticons">${ownedIcons(tr.crowns[c], "👑", 34, 1)}</div>
            <div class="tprog">${c==="gold" ? tr.crowns.gold+"/"+DO_GWIAZDY+" → 💎" : "× "+tr.crowns[c]}</div>
          </div>`).join("")}
      </div>
      <div class="bridge">
        <span>🥉👑×3 → 🥈👑</span>
        <span>🥈👑×3 → 🥇👑</span>
      </div>
    </div>`;

  // TIER: diament (szczyt)
  const gotDiamond = tr.diamond > 0;
  const diamondTier = `
    <div class="tier tier-diamond">
      <span class="${gotDiamond?"shine":""}" style="font-size:${gotDiamond?64:48}px;display:inline-block;${gotDiamond?"":"filter:grayscale(1);opacity:.35"}">💎</span>
      <div style="font-weight:800;font-size:18px">${gotDiamond ? "DIAMENT × "+tr.diamond : "DIAMENT — ???"}</div>
      <div class="muted" style="font-size:12px">szczyt: 3 złote korony 👑👑👑</div>
    </div>`;

  const arrow = txt => `<div class="arrow-up">▲<br><small>${txt}</small></div>`;

  return `
    <h2 style="font-size:24px;font-weight:800;margin:0 0 4px">🏆 Gablota — ${p.emoji} ${p.name}</h2>
    <p class="muted" style="font-size:13px;margin:0 0 12px">Zbieraj od dołu do góry! Trzy takie same = jedno wyżej. Brąz i srebro można wymieniać na wyższe 🔁</p>
    <div class="pyramid">
      ${medalsTier}
      ${arrow("3 medale = puchar")}
      ${cupsTier}
      ${arrow("3 puchary = korona")}
      ${crownsTier}
      ${arrow("3 złote korony = Diament")}
      ${diamondTier}
    </div>
    <p class="muted" style="font-size:12px;margin:12px 0 0">🏆 = +${zl(S().nagrodaPuchar)} · 👑 = +${zl(S().nagrodaKorona)} · 💎 = +${zl(S().nagrodaGwiazda)}</p>
    <button class="big-btn" onclick="goMenu()">← Menu</button>`;
}

function renderSettings() {
  const p = P(), s = S(), cfg = CFG();
  const field = (id, label, val, hint) => `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;text-align:left">
      <div style="flex:1"><div style="font-weight:800">${label}</div>${hint?`<div class="muted" style="font-size:12px">${hint}</div>`:""}</div>
      <input id="set-${id}" type="text" inputmode="decimal" value="${val}"
        style="width:70px;font-family:inherit;font-size:18px;font-weight:800;text-align:center;border:3px solid #D9D2F0;border-radius:12px;padding:6px;color:#3A3352">
      <span style="font-weight:800">zł</span>
    </div>`;
  // edytor progów stawki za kartę
  const tiers = (s.rateTiers || []).slice().sort((a,b)=>a.level-b.level);
  while (tiers.length < 3) tiers.push({ level: (tiers.length?tiers[tiers.length-1].level+2:1), zl: 1 });
  const tierRow = (i, t) => `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;text-align:left">
      <span>${moneyGraphic(t.zl, 34)}</span>
      <span style="font-weight:800">od poz.</span>
      <input id="tier-lvl-${i}" type="text" inputmode="numeric" value="${t.level}"
        style="width:44px;font-family:inherit;font-size:17px;font-weight:800;text-align:center;border:3px solid #D9D2F0;border-radius:12px;padding:6px;color:#3A3352">
      <span style="font-weight:800">→</span>
      <input id="tier-zl-${i}" type="text" inputmode="decimal" value="${t.zl}"
        style="width:58px;font-family:inherit;font-size:17px;font-weight:800;text-align:center;border:3px solid #D9D2F0;border-radius:12px;padding:6px;color:#3A3352">
      <span style="font-weight:800">zł</span>
    </div>`;
  // szacunek maks. dziennego zarobku (10 kart na najwyższym progu)
  const kart = 10;
  const topRate = tiers.reduce((m,t)=>Math.max(m,t.zl), 0);
  const perCard = topRate + (cfg.starTask ? s.zlGwiazdka : 0);
  const trofeaNaKart = (s.nagrodaPuchar/DO_PUCHARU) + (s.nagrodaKorona/(DO_PUCHARU*DO_KORONY)) + (s.nagrodaGwiazda/(DO_PUCHARU*DO_KORONY*DO_GWIAZDY));
  const est = Math.round((perCard + trofeaNaKart) * kart);
  return `
    <h2 style="font-size:24px;font-weight:800;margin:0 0 2px">⚙️ Ustawienia — ${p.emoji} ${p.name}</h2>
    <p class="muted" style="margin:0 0 14px;font-size:13px">Kwoty tylko dla tego profilu. Zmiany działają od następnej karty.</p>
    <p style="font-weight:800;text-align:left;margin:0 0 4px">Stawka za kartę wg poziomu:</p>
    <p class="muted" style="text-align:left;font-size:12px;margin:0 0 8px">„od poz. X → Y zł" = od tego poziomu wzwyż płacimy tyle. Łatwe poziomy dają mniej.</p>
    ${tierRow(0, tiers[0])}
    ${tierRow(1, tiers[1])}
    ${tierRow(2, tiers[2])}
    <hr style="border:none;border-top:2px dashed #D9D2F0;margin:14px 0">
    ${cfg.starTask ? field("zlGwiazdka", "Za zadanie z gwiazdką 🌟", s.zlGwiazdka) : `<input id="set-zlGwiazdka" type="hidden" value="${s.zlGwiazdka}">`}
    ${field("karaReset", "Kara za reset karty 💔", s.karaReset, "gdy dziecko straci wszystkie 3 życia")}
    <hr style="border:none;border-top:2px dashed #D9D2F0;margin:14px 0">
    <p style="font-weight:800;text-align:left;margin:0 0 8px">Premie za trofea (jednorazowo):</p>
    ${field("nagrodaPuchar", "🏆 Puchar (co 3 medale)", s.nagrodaPuchar)}
    ${field("nagrodaKorona", "👑 Korona (co 3 puchary)", s.nagrodaKorona)}
    ${field("nagrodaGwiazda", "💎 Diamentowa Gwiazda", s.nagrodaGwiazda)}
    <div style="background:#F4F9FF;border-radius:16px;padding:12px;margin:14px 0;font-weight:800">
      💡 Przy 10 kartach dziennie na najwyższym progu to ok. <span style="color:#35872F">${est} zł/dzień</span><br>
      <span class="muted" style="font-size:12px;font-weight:700">(z premiami za trofea; na łatwych poziomach dużo mniej)</span>
    </div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="ghost-btn" onclick="restoreDefaults()">↩️ Domyślne</button>
      <button class="big-btn" style="margin-top:0" onclick="saveSettings()">Zapisz ✅</button>
    </div>`;
}

function renderBank() {
  const p = P();
  const hist = p.history.slice().reverse().slice(0, 30);
  return `
    <h2 style="font-size:26px;font-weight:800;margin:0 0 4px">🏦 Bank — ${p.emoji} ${p.name}</h2>
    <p class="pop" style="font-size:40px;font-weight:800;margin:0">${zl(p.bank)}</p>
    <p class="muted" style="margin:2px 0 12px;font-size:14px">Uzbierane pieniążki za naukę</p>
    <div style="background:#FFFBEF;border:3px solid #F0E4B8;border-radius:20px;padding:14px;margin-bottom:14px">
      ${moneyBreakdownHTML(p.bank)}
    </div>
    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap">
      <button class="ghost-btn" onclick="payout()">💸 Wypłać</button>
      <button class="ghost-btn" onclick="exportData()">💾 Zapisz kopię</button>
      <button class="ghost-btn" onclick="importData()">📂 Wczytaj</button>
      <button class="ghost-btn" onclick="resetProfileData()">🗑️ Reset</button>
    </div>
    <p style="font-weight:800;text-align:left;margin:0 0 6px">Historia:</p>
    <div class="hist">
      ${hist.length ? hist.map(x=>`<div><span>${x.d} · ${x.op} ${x.lvl}${x.err!==""?" · błędy: "+x.err:""}</span><span style="color:${x.earn>=0?"#35872F":"#C75F3D"}">${(x.earn>=0?"+":"−")+zl(Math.abs(x.earn))}</span></div>`).join("") : "<div>Jeszcze pusto — czas na pierwszą kartę!</div>"}
    </div>
    <button class="big-btn" onclick="goMenu()">← Menu</button>`;
}

function render() {
  renderTopbar();
  const app = document.getElementById("app");
  if (ui.screen==="profiles") app.innerHTML = renderProfiles();
  else if (ui.screen==="addProfile") app.innerHTML = renderAddProfile();
  else if (ui.screen==="menu") app.innerHTML = renderMenu();
  else if (ui.screen==="sheet") app.innerHTML = renderSheet();
  else if (ui.screen==="trophies") app.innerHTML = renderTrophies();
  else if (ui.screen==="settings") app.innerHTML = renderSettings();
  else app.innerHTML = renderBank();
  document.getElementById("footer").textContent = ui.currentId && P()
    ? "Ukończone karty (" + P().name + "): " + P().history.filter(x=>["Wypłata","Reset karty"].indexOf(x.lvl)<0 && x.op!=="🎁").length
    : "Wersja rodzinna · dane zapisują się na tym urządzeniu";
}
render();
</script>
